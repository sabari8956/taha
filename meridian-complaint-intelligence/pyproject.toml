[project]
name = "meridian-complaint-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "duckdb>=1.5.4",
    "flask>=3.1.3",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.3.0",
    "langgraph>=1.2.0",
    "openai>=2.46.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
meridian-assistant = "meridian_assistant.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
